<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="55%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- ghost glyph background -->
  <g opacity="0.05">
    <rect x="1280" y="120" width="90" height="840" rx="34" fill="#ffffff"/>
    <rect x="1280" y="120" width="520" height="90" rx="34" fill="#ffffff"/>
    <rect x="1280" y="480" width="380" height="90" rx="34" fill="#ffffff"/>
  </g>

  <!-- frame + corner ticks -->
  <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
    <path d="M 40 88 V 40 H 88"/>
    <path d="M 1832 40 H 1880 V 88"/>
    <path d="M 1880 992 V 1040 H 1832"/>
    <path d="M 88 1040 H 40 V 992"/>
  </g>

  <!-- top meta row -->
  <text x="96" y="118" fill="#ffffff" fill-opacity="0.55" font-size="26" letter-spacing="8" font-weight="500">FABY // AI-NATIVE LANGUAGE</text>
  <text x="1824" y="118" text-anchor="end" fill="#ffffff" fill-opacity="0.55" font-size="26" letter-spacing="8" font-weight="500">V0.1 GENESIS</text>
  <line x1="96" y1="148" x2="1824" y2="148" stroke="url(#fade)" stroke-width="2"/>

  <!-- wordmark -->
  <text x="92" y="540" fill="#ffffff" font-size="300" font-weight="800" letter-spacing="26">FABY</text>
  <line x1="96" y1="600" x2="980" y2="600" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- tagline -->
  <text x="96" y="678" fill="#ffffff" font-size="42" font-weight="600" letter-spacing="13">THE AI-NATIVE PROGRAMMING LANGUAGE</text>
  <text x="96" y="736" fill="#ffffff" fill-opacity="0.55" font-size="30" letter-spacing="6">DESIGNED BY CLAUDE FABLE-5 &#183; OPTIMIZED FOR AI &#183; BUILT FOR EVERYTHING</text>

  <!-- code chip -->
  <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect x="96" y="800" width="760" height="150" rx="16" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="136" cy="838" r="7" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="162" cy="838" r="7" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="188" cy="838" r="7" fill="#ffffff" fill-opacity="0.25"/>
    <text x="132" y="900" font-size="30" fill="#ffffff" fill-opacity="0.45">flow</text>
    <text x="212" y="900" font-size="30" fill="#ffffff">future() -&gt; Now</text>
    <text x="132" y="938" font-size="30" fill="#ffffff" fill-opacity="0.45">$</text>
    <text x="160" y="938" font-size="30" fill="#ffffff" fill-opacity="0.85">faby run tomorrow.fy &#9608;</text>
  </g>

  <!-- mini glyph bottom right -->
  <g transform="translate(1700,860)">
    <rect width="120" height="120" fill="#000000" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="38" y="30" width="11" height="62" rx="4" fill="#ffffff"/>
    <rect x="38" y="30" width="50" height="11" rx="4" fill="#ffffff"/>
    <rect x="38" y="56" width="36" height="11" rx="4" fill="#ffffff"/>
    <circle cx="86" cy="61" r="4.5" fill="#ffffff"/>
  </g>
</svg>
