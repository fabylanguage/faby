<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="22" y="22" width="468" height="468" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- corner ticks -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M 86 70 H 110 M 70 86 V 110"/>
    <path d="M 426 70 H 402 M 442 86 V 110"/>
    <path d="M 86 442 H 110 M 70 426 V 402"/>
    <path d="M 426 442 H 402 M 442 426 V 402"/>
  </g>

  <!-- F glyph built from flow bars -->
  <g filter="url(#soft)">
    <!-- stem -->
    <rect x="170" y="134" width="40" height="244" rx="14" fill="#ffffff"/>
    <!-- top bar -->
    <rect x="170" y="134" width="196" height="40" rx="14" fill="#ffffff"/>
    <!-- mid bar -->
    <rect x="170" y="238" width="138" height="40" rx="14" fill="#ffffff"/>
  </g>

  <!-- pipeline nodes -->
  <circle cx="350" cy="258" r="13" fill="#ffffff"/>
  <line x1="312" y1="258" x2="333" y2="258" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>

  <!-- terminal cursor accent -->
  <rect x="232" y="346" width="40" height="32" rx="8" fill="#ffffff" fill-opacity="0.92"/>
</svg>
